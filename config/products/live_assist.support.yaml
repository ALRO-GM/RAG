product: live_assist.support
version: 1
language: es
source: {kind: pipewire, channels: {0: {speaker: S1, role: agent}, 1: {speaker: S2, role: customer}}}
vad: {model: silero-v5, hang_ms: 500}
asr: {kind: stream, model: faster-whisper-large-v3-turbo-int8, partial_every_ms: 800}
attribution: {kind: channels}
knowledge: {domains: [support.demo], top_k: 4}
reasoner: {role: suggester, model: haiku, template: "suggester.support@2", deadline_ms: 2800, max_inflight: 1, max_suggestions: 1, expressed_signals: true}
trigger: {on: final, speaker_roles: [customer], min_words: 4, debounce_ms: 300, cancel_stale: true}
ui: {kind: live_page}
privacy: {store_audio: false, store_text_days: 30, banner: "support_ai_notice@1"}
handoff: {transcript_v1: true, run_post_call: false}
