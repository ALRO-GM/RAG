# RAGPutin on the Peer4U server: one small Caddy container.
# It serves the transcriber's pages (/opt/ragputin/pruebas, written by
# CI) and passes /api/* to the workstation through the unix socket the
# workstation's SSH reverse forward creates in /opt/ragputin/run. The
# models and every stored byte stay on the workstation: nothing heavy
# runs next to Peer4U.
name: ragputin

services:
  web:
    image: caddy:2.10-alpine
    restart: unless-stopped
    # The uid/gid of `ubuntu`, which owns the tunnel socket (sshd creates
    # it with mode 0600 for the user that logged in).
    user: "1001:1001"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../pruebas:/srv:ro
      # Read-only is enough: connecting to a unix socket needs write
      # permission on the socket itself (owner 1001, mode 0600), which
      # a read-only mount does not take away (checked with
      # infra/tests/docker_proof.py).
      - ../run:/run/tunnel:ro
    networks:
      peer4u:
        aliases: [ragputin-web]
    read_only: true
    tmpfs:
      - /tmp:uid=1001,gid=1001,mode=700
      - /config:uid=1001,gid=1001,mode=700
      - /data:uid=1001,gid=1001,mode=700
    cap_drop: [ALL]
    # Port 80 as a non-root user: docker already opens the low ports in
    # the container's own network namespace; the sysctl says so
    # explicitly. The capability is kept for a root run of the image.
    cap_add: [NET_BIND_SERVICE]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  peer4u:
    external: true
    name: sanatorio_default
