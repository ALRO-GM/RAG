# RAGPutin on the Peer4U server: one small static file server.
# The experiments run on the workstation (GPU); this host only serves
# their results, so nothing heavy runs next to Peer4U.
name: ragputin

services:
  web:
    image: caddy:2.10-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../pruebas:/srv:ro
    networks:
      peer4u:
        aliases: [ragputin-web]
    read_only: true
    tmpfs: [/tmp, /config, /data]
    cap_drop: [ALL]
    # The caddy binary carries the file capability to bind port 80.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/data/manifest.json"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  peer4u:
    external: true
    name: sanatorio_default
